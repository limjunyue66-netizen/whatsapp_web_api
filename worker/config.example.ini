[worker]
# Copy this file to config.ini and fill in values.
# config.ini is gitignored — never commit real tokens.

api_base_url = http://localhost/whatsapp_web_api/web/api/worker
worker_token = REPLACE_WITH_TOKEN_FROM_ADMIN_WORKERS_PAGE
worker_version = 1.0.0
poll_interval_seconds = 5
heartbeat_interval_seconds = 20
browser = msedge
headless = false
profile_dir = browser_profile
temp_media_dir = temp_media
screenshot_dir = screenshots
navigation_timeout_ms = 60000
send_timeout_ms = 90000
